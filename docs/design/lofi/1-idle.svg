<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860"><rect width="1400" height="860" fill="#f7f6f3"/><rect x="0" y="0" width="1400" height="48" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="0" y1="48" x2="1400" y2="48" stroke="#2b2b2b" stroke-width="1.5"/><rect x="16" y="15" width="18" height="18" rx="3" fill="none" stroke="#2b2b2b" stroke-width="1.5"/><text x="42" y="29" font-size="13" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Scripture Panel</text><rect x="150" y="10" width="84" height="28" rx="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.5"/><text x="192" y="29" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Listen</text><circle cx="1030" cy="24" r="3.5" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/><text x="1039" y="28" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Whisper</text><circle cx="1118" cy="24" r="3.5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.5"/><text x="1127" y="28" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">LM Studio</text><circle cx="1206" cy="24" r="3.5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.5"/><text x="1215" y="28" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">VideoPsalm</text><circle cx="1294" cy="24" r="3.5" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.5"/><text x="1303" y="28" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">KJV</text><rect x="1360" y="10" width="28" height="28" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/><line x1="1367" y1="20" x2="1381" y2="20" stroke="#2b2b2b" stroke-width="1.5"/><line x1="1367" y1="28" x2="1381" y2="28" stroke="#2b2b2b" stroke-width="1.5"/><rect x="0" y="48" width="340" height="780" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="0" y1="88" x2="340" y2="88" stroke="#c9c9c9" stroke-width="1"/><text x="16" y="73" font-size="12" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Transcript</text><line x1="0" y1="796" x2="340" y2="796" stroke="#c9c9c9" stroke-width="1"/><text x="16" y="817" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0 words</text><line x1="340" y1="48" x2="340" y2="828" stroke="#2b2b2b" stroke-width="1.5"/><text x="170.0" y="150" font-size="13" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">The transcript appears here</text><text x="170.0" y="170" font-size="13" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">once you start listening.</text><rect x="106.0" y="184" width="40" height="18" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/><text x="126.0" y="197" font-size="10" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl L</text><text x="154.0" y="197" font-size="12" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">or click Listen.</text><rect x="340" y="48" width="700" height="780" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="340" y1="88" x2="1040" y2="88" stroke="#c9c9c9" stroke-width="1"/><text x="356" y="73" font-size="12" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Next up</text><line x1="340" y1="796" x2="1040" y2="796" stroke="#c9c9c9" stroke-width="1"/><text x="356" y="817" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Newest first</text><text x="1024" y="817" font-size="11" fill="#707070" font-weight="normal" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Suggestions clear after 5 minutes</text><rect x="356" y="102" width="668" height="34" rx="4" fill="#ececec" stroke="#707070" stroke-width="1.5"/><circle cx="374" cy="118" r="5" fill="none" stroke="#707070" stroke-width="1.5"/><line x1="378" y1="122" x2="382" y2="126" stroke="#707070" stroke-width="1.5"/><text x="392" y="124" font-size="13" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Look up a reference, e.g. Romans 8:28</text><rect x="968" y="110" width="46" height="18" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/><text x="991" y="123" font-size="10" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl F</text><line x1="340" y1="152" x2="1040" y2="152" stroke="#c9c9c9" stroke-width="1"/><text x="690.0" y="242" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">No suggestions yet.</text><text x="690.0" y="268" font-size="12" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Verses appear here as they are cited or paraphrased.</text><text x="690.0" y="286" font-size="12" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Press a number key to send one to VideoPsalm.</text><rect x="1040" y="48" width="360" height="780" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="1040" y1="88" x2="1400" y2="88" stroke="#c9c9c9" stroke-width="1"/><text x="1056" y="73" font-size="12" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">On screen</text><line x1="1040" y1="796" x2="1400" y2="796" stroke="#c9c9c9" stroke-width="1"/><text x="1056" y="817" font-size="11" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">0 used this service</text><line x1="1040" y1="48" x2="1040" y2="828" stroke="#2b2b2b" stroke-width="1.5"/><rect x="1056" y="102" width="328" height="110" rx="4" fill="#ffffff" stroke="#707070" stroke-width="1.5" stroke-dasharray="6 4"/><text x="1220.0" y="148" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Nothing on screen yet.</text><text x="1220.0" y="172" font-size="12" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Press 1 to send the top suggestion.</text><rect x="0" y="828" width="1400" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="0" y1="828" x2="1400" y2="828" stroke="#2b2b2b" stroke-width="1.5"/><text x="16" y="849" font-size="12" fill="#707070" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ready</text><rect x="990" y="836" width="92" height="17" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/><text x="1036" y="848" font-size="10" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1-9  Send</text><rect x="1090" y="836" width="92" height="17" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/><text x="1136" y="848" font-size="10" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl F  Find</text><rect x="1190" y="836" width="92" height="17" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/><text x="1236" y="848" font-size="10" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl L  Listen</text><rect x="1290" y="836" width="92" height="17" rx="3" fill="#ffffff" stroke="#c9c9c9" stroke-width="1"/><text x="1336" y="848" font-size="10" fill="#707070" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl ,  Settings</text><rect x="0.75" y="0.75" width="1398.5" height="858.5" fill="none" stroke="#2b2b2b" stroke-width="1.5"/></svg>
