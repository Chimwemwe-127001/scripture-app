4" font-size="13" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Good morning, church. Today we're going to</text><text x="64" y="133" font-size="13" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">look at one of the most beloved passages in</text><text x="64" y="152" font-size="13" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">all of scripture.</text><text x="16" y="180" font-size="10" fill="#9a9a9a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">0:03</text><text x="64" y="180" font-size="13" fill="#2b2b2b" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><tspan font-weight="bold" text-decoration="underline">John 3:16</tspan> tells us that God so loved the</text><text x="64" y="199" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">world, that he gave his only begotten Son.</text><rect x="64" y="219" width="7" height="14" rx="0" fill="#9a9a9a" stroke="none" stroke-width="0"/><rect x="340" y="48" width="700" height="780" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="340" y1="88" x2="1040" y2="88" stroke="#cfcfcf" stroke-width="1"/><text x="356" y="73" font-size="12" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Next up</text><text x="411" y="73" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">1</text><text x="1024" y="73" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Clear</text><line x1="340" y1="796" x2="1040" y2="796" stroke="#cfcfcf" stroke-width="1"/><text x="356" y="817" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Newest first</text><text x="1024" y="817" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Suggestions clear after 5 minutes</text><rect x="356" y="102" width="668" height="34" rx="4" fill="#ededed" stroke="#6b6b6b" stroke-width="1.5"/><circle cx="374" cy="118" r="5" fill="none" stroke="#6b6b6b" stroke-width="1.5"/><line x1="378" y1="122" x2="382" y2="126" stroke="#6b6b6b" stroke-width="1.5"/><text x="392" y="124" font-size="13" fill="#9a9a9a" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Look up a reference, e.g. Romans 8:28</text><rect x="968" y="110" width="46" height="18" rx="3" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><text x="991.0" y="123" font-size="10" fill="#6b6b6b" font-weight="normal" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">Ctrl F</text><line x1="340" y1="152" x2="1040" y2="152" stroke="#cfcfcf" stroke-width="1"/><rect x="341" y="152" width="698" height="134" rx="0" fill="#ededed" stroke="none" stroke-width="0"/><rect x="340" y="152" width="4" height="134" rx="0" fill="#2b2b2b" stroke="none" stroke-width="0"/><line x1="340" y1="286" x2="1040" y2="286" stroke="#cfcfcf" stroke-width="1"/><text x="370" y="184" font-size="24" fill="#2b2b2b" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">1</text><text x="404" y="180" font-size="15" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">John 3:16</text><text x="482.9" y="180" font-size="10" fill="#9a9a9a" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">KJV</text><rect x="940" y="174" width="4" height="6" rx="0" fill="#2b2b2b" stroke="none" stroke-width="0"/><rect x="946" y="171" width="4" height="9" rx="0" fill="#2b2b2b" stroke="none" stroke-width="0"/><rect x="952" y="168" width="4" height="12" rx="0" fill="#2b2b2b" stroke="none" stroke-width="0"/><text x="964" y="179" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">High</text><text x="404" y="206" font-size="15" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">For God so loved the world, that he gave his only begotten Son, that whosoever believeth in</text><text x="404" y="227" font-size="15" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="Georgia, 'Times New Roman', serif">him should not perish, but have everlasting life.</text><text x="404" y="264" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Cited</text><rect x="934" y="248" width="88" height="28" rx="4" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="1.5"/><text x="978" y="266" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Send  1</text><rect x="902" y="252" width="20" height="20" rx="3" fill="#ffffff" stroke="#cfcfcf" stroke-width="1"/><rect x="907" y="257" width="8" height="8" rx="1" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/><rect x="340" y="796" width="700" height="32" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><line x1="340" y1="796" x2="1040" y2="796" stroke="#cfcfcf" stroke-width="1"/><text x="356" y="817" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Newest first</text><text x="1024" y="817" font-size="11" fill="#6b6b6b" font-weight="normal" text-anchor="end" font-f