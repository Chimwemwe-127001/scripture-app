 y="472" width="330" height="9" rx="4.5" fill="#c4c4c4"/><rect x="392" y="490" width="90" height="6" rx="3.0" fill="#c4c4c4"/><rect x="726" y="482" width="70" height="22" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/><text x="761" y="497" font-size="11" fill="#2b2b2b" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Send 3</text><line x1="340" y1="610" x2="820" y2="610" stroke="#c4c4c4" stroke-width="1"/><text x="366" y="544" font-size="18" fill="#6f6f6f" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text><rect x="392" y="530" width="110" height="10" rx="5.0" fill="#6f6f6f"/><rect x="752" y="536" width="4" height="6" rx="0" fill="#6f6f6f" stroke="none" stroke-width="0"/><rect x="758" y="533" width="4" height="9" rx="0" fill="#6f6f6f" stroke="none" stroke-width="0"/><rect x="764" y="530" width="4" height="12" rx="0" fill="#6f6f6f" stroke="none" stroke-width="0"/><rect x="392" y="552" width="380" height="9" rx="4.5" fill="#c4c4c4"/><rect x="392" y="568" width="330" height="9" rx="4.5" fill="#c4c4c4"/><rect x="392" y="586" width="90" height="6" rx="3.0" fill="#c4c4c4"/><rect x="726" y="578" width="70" height="22" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/><text x="761" y="593" font-size="11" fill="#2b2b2b" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Send 4</text><rect x="836" y="176" width="308" height="196" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/><rect x="836" y="176" width="308" height="6" rx="0" fill="#2b2b2b" stroke="none" stroke-width="0"/><text x="852" y="204" font-size="10" fill="#2b2b2b" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">ON SCREEN</text><text x="1128" y="204" font-size="10" fill="#6f6f6f" font-weight="normal" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">10:42</text><rect x="852" y="218" width="120" height="12" rx="6.0" fill="#2b2b2b"/><rect x="852" y="244" width="270" height="9" rx="4.5" fill="#c4c4c4"/><rect x="852" y="261" width="260" height="9" rx="4.5" fill="#c4c4c4"/><rect x="852" y="278" width="250" height="9" rx="4.5" fill="#c4c4c4"/><rect x="852" y="295" width="180" height="9" rx="4.5" fill="#c4c4c4"/><rect x="852" y="330" width="94" height="24" rx="4" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/><text x="899" y="346" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Send again</text><text x="836" y="400" font-size="10" fill="#6f6f6f" font-weight="bold" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">EARLIER</text><line x1="820" y1="414" x2="1160" y2="414" stroke="#c4c4c4" stroke-width="1"/><rect x="836" y="428" width="30" height="6" rx="3.0" fill="#c4c4c4"/><rect x="880" y="425" width="90" height="9" rx="4.5" fill="#6f6f6f"/><rect x="880" y="440" width="220" height="7" rx="3.5" fill="#c4c4c4"/><line x1="820" y1="458" x2="1160" y2="458" stroke="#c4c4c4" stroke-width="1"/><rect x="836" y="472" width="30" height="6" rx="3.0" fill="#c4c4c4"/><rect x="880" y="469" width="90" height="9" rx="4.5" fill="#6f6f6f"/><rect x="880" y="484" width="220" height="7" rx="3.5" fill="#c4c4c4"/><line x1="820" y1="502" x2="1160" y2="502" stroke="#c4c4c4" stroke-width="1"/><rect x="836" y="516" width="30" height="6" rx="3.0" fill="#c4c4c4"/><rect x="880" y="513" width="90" height="9" rx="4.5" fill="#6f6f6f"/><rect x="880" y="528" width="220" height="7" rx="3.5" fill="#c4c4c4"/><line x1="40" y1="618" x2="1160" y2="618" stroke="#2b2b2b" stroke-width="1.5"/><text x="56" y="638" font-size="11" fill="#6f6f6f" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ready</text><rect x="780" y="626" width="84" height="16" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/><text x="822" y="638" font-size="10" fill="#6f6f6f" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1-9 Send</text><rect x="872" y="626" width="84" height="16" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/><text x="914" y="638" font-size="10" fill="#6f6f6f" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl F Find</text><rect x="964" y="626" width="84" height="16" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/><text x="1006" y="638" font-size="10" fill="#6f6f6f" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl L Listen</text><rect x="1056" y="626" width="84" height="16" rx="3" fill="#ffffff" stroke="#c4c4c4" stroke-width="1"/><text x="1098" y="638" font-size="10" fill="#6f6f6f" font-weight="normal" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ctrl , Settings</text><circle cx="196" cy="96" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="196" y="100" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text><circle cx="770" cy="90" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="770" y="94" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2</text><circle cx="100" cy="228" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="100" y="232" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3</text><circle cx="344" cy="222" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="344" y="226" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text><circle cx="1144" cy="180" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="1144" y="184" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5</text><circle cx="780" cy="622" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="780" y="626" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">6</text><circle cx="56" cy="696" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="56" y="700" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1</text><text x="78" y="700" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Session control first. Before a service the only action is Listen.</text><circle cx="56" cy="740" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="56" y="744" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2</text><text x="78" y="744" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">System status in words, not colour alone. Optional parts say they are optional.</text><circle cx="56" cy="784" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="56" y="788" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3</text><text x="78" y="788" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Transcript as a timed log. The heard words are marked and tagged.</text><circle cx="616" cy="696" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="616" y="700" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4</text><text x="638" y="700" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Next up. The top card is always key 1, so the most likely verse is one press away.</text><circle cx="616" cy="740" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="616" y="744" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5</text><text x="638" y="744" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">On screen mirrors what the congregation sees. Earlier verses stay one click away.</text><circle cx="616" cy="784" r="11" fill="#2b2b2b" stroke="#ffffff" stroke-width="2"/><text x="616" y="788" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">6</text><text x="638" y="788" font-size="13" fill="#2b2b2b" font-weight="normal" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Shortcuts always visible, so a new volunteer can learn them during the service.</text></svg>
